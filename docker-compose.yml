services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: aviraa-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-aviraa_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-AviraaRoot2024!}
      MONGO_INITDB_DATABASE: aviraa
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/data/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - aviraa-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aviraa-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_USER:-aviraa_user}:${MONGO_PASSWORD:-AviraaUser2024!}@mongodb:27017/aviraa?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-aviraa_super_secret_key_change_me_2024}
      JWT_EXPIRE: ${JWT_EXPIRE:-30d}
      CLIENT_URL: http://localhost:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta}
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - aviraa-network
    command: ["node", "server.js"]

  # Frontend (Nginx serving static files)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aviraa-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - aviraa-network

volumes:
  mongodb_data:
    driver: local

networks:
  aviraa-network:
    driver: bridge
