[pytest]
# Note: We cannot run medical-bill-backend and data-extraction-service tests together
# from the repo root because both have 'app' packages, causing import collision.
# Instead, use pytest -c pytest-backend.ini or pytest -c pytest-extraction.ini
# to run each service's tests in isolation.
#
# Alternatively, run from the service directory directly:
#   cd medical-bill-backend && pytest
#   cd data-extraction-service && pytest
testpaths = medical-bill-backend/tests data-extraction-service/tests bill_rules/tests
addopts = -p conftest
