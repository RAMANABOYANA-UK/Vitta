# nginx config for the Vitta static frontend.
# Serves the SPA and proxies the API to the backend container (`backend:8000`).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Proxy API + health to the backend service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads can be large (up to the backend's 20MB cap); raise the default.
        client_max_body_size 25m;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Static assets with long cache for immutable-looking files is overkill here;
    # just serve them normally.
    location / {
        try_files $uri $uri/ /index.html;
    }
}